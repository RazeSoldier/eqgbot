plugins {
    id 'java-library'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.0.10'
    id "io.freefair.lombok" version "8.7.1"
}

group 'razesoldier'
version '3.6.3'

repositories {
    mavenCentral()
}

dependencies {
    {
        // mirai https://github.com/mamoe/mirai
        var miraiVersion = "2.16.0"
        api("net.mamoe:mirai-core-api:" + miraiVersion) // 编译代码使用
        runtimeOnly("net.mamoe:mirai-core:" + miraiVersion) // 运行时使用
    }
    implementation fileTree('libs')
    implementation('org.asynchttpclient:async-http-client:3.0.0') // libs/fix-protocol-version依赖这个库
    implementation('mysql:mysql-connector-java:8.0.33') // https://github.com/mysql/mysql-connector-j
    implementation('com.beust:jcommander:1.82')
    implementation('io.timeandspace:cron-scheduler:0.1') // https://github.com/TimeAndSpaceIO/CronScheduler
    implementation('org.apache.commons:commons-lang3:3.16.0')
    implementation('com.alibaba.fastjson2:fastjson2:2.0.52')
    implementation('redis.clients:jedis:4.4.8')
    implementation('org.seleniumhq.selenium:selenium-java:4.23.1')
    implementation('org.apache.logging.log4j:log4j-core:2.23.1')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.11.1')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.0')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.11.1')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

application {
    mainClass = 'razesoldier.eqgbot.Entry'
    applicationDefaultJvmArgs = ['-Xms128m', '-Xmx128m', '-Dmirai.no-desktop']
}

test {
    useJUnitPlatform()
}
